name: xpaper

on:
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: node xpaper.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csv-${{ github.run_number }}
          path: out-paper/
