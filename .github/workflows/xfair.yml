name: xfair

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Numero di round (max 60)"
        default: "60"
      edge:
        description: "Sconto minimo sul prezzo giusto (0.05 = compra solo 5 centesimi sotto)"
        default: "0.05"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installa dipendenze
        run: npm install ws@8
      - name: Avvia bot fair value
        env:
          ROUNDS: ${{ github.event.inputs.rounds }}
          EDGE: ${{ github.event.inputs.edge }}
        run: node xfair.js
      - name: Salva risultati
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-fair
          path: out-fair/
