name: xreal paper demo

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa dipendenze
        run: npm install

      - name: Lancia il bot
        run: node xreal.js

      - name: Carica i risultati
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-real
          path: out-real/
          retention-days: 30
